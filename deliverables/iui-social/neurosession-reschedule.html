<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}html,body{width:1600px;height:900px;margin:0;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#142039}.canvas{position:relative;width:1600px;height:900px;overflow:hidden;background:#f9fbff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.88) 42%,rgba(255,255,255,.08) 77%)}.content{position:absolute;z-index:2;left:94px;top:72px;width:720px}.brand{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:800;letter-spacing:-.02em}.brand img{width:52px;height:52px}.brand b{color:#6559d8}.pill{display:inline-flex;align-items:center;gap:9px;margin-top:92px;padding:11px 16px;border:1px solid #dcd7fb;border-radius:999px;background:rgba(255,255,255,.7);color:#6559d8;font-size:13px;font-weight:800;letter-spacing:.11em}.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:#7669df;box-shadow:0 0 0 5px rgba(118,105,223,.11)}h1{margin:25px 0 20px;font-size:72px;line-height:.99;letter-spacing:-.062em}.gradient{background:linear-gradient(95deg,#5d50ce,#7762dd 48%,#37a6d6);-webkit-background-clip:text;background-clip:text;color:transparent}.lead{max-width:660px;margin:0;color:#657389;font-size:24px;line-height:1.48;letter-spacing:-.018em}.note{display:flex;align-items:center;gap:13px;margin-top:34px;width:max-content;padding:15px 19px;border:1px solid rgba(216,220,235,.9);border-radius:17px;background:rgba(255,255,255,.78);box-shadow:0 14px 40px rgba(49,65,105,.08);backdrop-filter:blur(14px);font-size:17px;font-weight:700;color:#46546b}.note i{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#eeebff;color:#6558d4;font-style:normal}.footer{position:absolute;z-index:2;left:94px;bottom:64px;color:#8d98a9;font-size:14px}.contact{position:absolute;z-index:2;right:74px;bottom:58px;padding:13px 18px;border:1px solid rgba(255,255,255,.7);border-radius:14px;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);color:#536178;font-size:14px}.contact b{color:#6659d5}
</style>
</head>
<body><main class="canvas">
  <img class="bg" src="neurosession-reschedule-background.png" alt="">
  <div class="shade"></div>
  <section class="content">
    <div class="brand"><img src="../../public/brand/iui-mark-v3.svg" alt="IUI">IUI <b>TECHNOLOGY</b></div>
    <div class="pill">ВАЖНОЕ УВЕДОМЛЕНИЕ</div>
    <h1>Нейросессии<br><span class="gradient">переносятся</span></h1>
    <p class="lead">По организационным причинам мы переносим запланированные нейросессии. Новую дату и время сообщим отдельно.</p>
    <div class="note"><i>✓</i>Ваша запись сохранена</div>
  </section>
  <div class="footer">Спасибо за понимание 💙<br>Команда IUI Technology</div>
  <div class="contact">Связь с нами: <b>+7 778 303 4567</b></div>
</main></body>
</html>
